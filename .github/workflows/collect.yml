name: Сбор новостей

on:
  schedule:
    # 02:07 UTC = 05:07 по Москве. GitHub может задержать запуск до часа — к 9:00 данные будут.
    - cron: "7 2 * * *"
  workflow_dispatch: {}   # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Собрать данные
        run: python collect.py

      - name: Сохранить в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git commit -m "Данные за $(TZ=Europe/Moscow date +%F)" || echo "Нет изменений"
          git push
